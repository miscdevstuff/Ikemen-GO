name: Build Android

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app_android/package-lock.json

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          cmd-line-tools-version: 11.0

      # Install the exact NDK version required by the project
      - name: Install NDK
        run: sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Build gl4es
        run: bash build_scripts/build_gl4es.sh

      - name: Build GLU
        run: bash build_scripts/build_glu.sh

      - name: Build Ikemen GO Shared Lib
        run: bash build_scripts/build_ikemengo_android.sh

      - name: Install NPM Dependencies
        working-directory: ./app_android
        run: npm ci

      - name: Build APK
        working-directory: ./app_android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ikemen-go-android
          path: app_android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
